<form action="/proses-pendaftaran" method="POST" enctype="multipart/form-data">
    
    <div>
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama" required>
    </div>

    <div>
        <label for="email">Email Aktif:</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
    </div>

    <div>
        <label for="umur">Umur:</label>
        <input type="number" id="umur" name="umur" min="17">
    </div>

    <div>
        <label for="tanggal_lahir">Tanggal Lahir:</label>
        <input type="date" id="tanggal_lahir" name="tanggal_lahir">
    </div>

    <div>
        <p>Jenis Kelamin:</p>
        <input type="radio" id="pria" name="gender" value="L">
        <label for="pria">Pria</label>
        
        <input type="radio" id="wanita" name="gender" value="P">
        <label for="wanita">Perempuan</label>
    </div>

    <div>
        <p>Hobi Kamu:</p>
        <input type="checkbox" id="coding" name="hobi" value="coding">
        <label for="coding">Coding</label>
        
        <input type="checkbox" id="gaming" name="hobi" value="gaming">
        <label for="gaming">Gaming</label>
    </div>

    <div>
        <label for="kota">Kota Asal:</label>
        <select id="kota" name="kota">
            <option value="medan">Medan</option>
            <option value="jakarta">Jakarta</option>
            <option value="surabaya">Surabaya</option>
        </select>
    </div>

    <div>
        <label for="alamat">Alamat Lengkap:</label>
        <textarea id="alamat" name="alamat" rows="4"></textarea>
    </div>

    <div>
        <label for="foto">Upload Foto Profil:</label>
        <input type="file" id="foto" name="foto">
    </div>

    <div>
        <button type="submit">Daftar Sekarang</button>
    </div>

</form>
